name: Deploy Python App to Public EC2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ec2-python-app-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy through public IP and SSH
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Find EC2 instance created by Terraform
        id: instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=python-github-actions-ec2" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          test -n "$INSTANCE_ID" && test "$INSTANCE_ID" != "None"
          PUBLIC_IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          SG_ID=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].SecurityGroups[0].GroupId' --output text)
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"
          echo "security_group_id=$SG_ID" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key

      - name: Temporarily allow SSH from this GitHub runner
        id: ingress
        env:
          SECURITY_GROUP_ID: ${{ steps.instance.outputs.security_group_id }}
        run: |
          set -euo pipefail
          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          RUNNER_CIDR="$RUNNER_IP/32"
          echo "runner_cidr=$RUNNER_CIDR" >> "$GITHUB_OUTPUT"
          PERMISSION=$(jq -nc --arg cidr "$RUNNER_CIDR" \
            '[{IpProtocol:"tcp",FromPort:22,ToPort:22,IpRanges:[{CidrIp:$cidr,Description:"Temporary GitHub Actions SSH"}]}]')
          aws ec2 authorize-security-group-ingress --group-id "$SECURITY_GROUP_ID" --ip-permissions "$PERMISSION"

      - name: Package application
        run: tar -czf deployment.tar.gz app scripts/deploy.sh

      - name: Copy and deploy application on EC2
        env:
          EC2_HOST: ${{ steps.instance.outputs.public_ip }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if ssh-keyscan -T 5 -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            echo "Waiting for SSH on EC2 ($attempt/12)..."
            sleep 10
          done
          ssh -i ~/.ssh/ec2_deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
            "ubuntu@$EC2_HOST" "mkdir -p /tmp/python-app-deploy"
          scp -i ~/.ssh/ec2_deploy_key -o BatchMode=yes deployment.tar.gz \
            "ubuntu@$EC2_HOST:/tmp/python-app-deploy/deployment.tar.gz"
          ssh -i ~/.ssh/ec2_deploy_key -o BatchMode=yes "ubuntu@$EC2_HOST" \
            "cd /tmp/python-app-deploy && tar -xzf deployment.tar.gz && sudo bash scripts/deploy.sh && curl --fail --retry 10 --retry-connrefused --retry-delay 3 http://127.0.0.1:5000/health"

      - name: Remove temporary SSH ingress rule
        if: always() && steps.ingress.outputs.runner_cidr != ''
        env:
          SECURITY_GROUP_ID: ${{ steps.instance.outputs.security_group_id }}
          RUNNER_CIDR: ${{ steps.ingress.outputs.runner_cidr }}
        run: |
          PERMISSION=$(jq -nc --arg cidr "$RUNNER_CIDR" \
            '[{IpProtocol:"tcp",FromPort:22,ToPort:22,IpRanges:[{CidrIp:$cidr}]}]')
          aws ec2 revoke-security-group-ingress --group-id "$SECURITY_GROUP_ID" --ip-permissions "$PERMISSION"

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_deploy_key
